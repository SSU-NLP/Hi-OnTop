[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "hi-ontop"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "nltk>=3.9,<4", "scikit-learn>=1.5,<2"]
[project.optional-dependencies]
text = ["sentence-transformers==3.4.1", "transformers==4.49.0"]
annotation = ["openai>=1.50,<3"]
test = ["pytest>=8,<10"]
[project.scripts]
hi-ontop = "hi_ontop.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
